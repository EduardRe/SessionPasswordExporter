name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  windows:
    name: Windows checks
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-targets

      - name: Build Windows packages
        shell: pwsh
        run: |
          .\scripts\build-windows-packages.ps1 `
            -OutputDirectory (Join-Path $env:RUNNER_TEMP "session-password-exporter-packages")

      - name: Publish release from master
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .\scripts\publish-master-release.ps1 `
            -ReleaseDirectory (Join-Path $env:RUNNER_TEMP "session-password-exporter-packages")
